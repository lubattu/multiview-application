name: Bug report
description: Report something broken in the app
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: App version
      description: Version of PokeIdleMultiview.exe (see the Releases page)
      placeholder: e.g. 1.5.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / console output
      description: Optional, but very helpful.

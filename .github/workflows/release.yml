name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # --publish never: quem anexa o exe ao release é o passo seguinte
      # (softprops/action-gh-release). Sem isso o electron-builder tenta publicar
      # sozinho em build de tag e falha por falta de GH_TOKEN.
      - run: npx electron-builder --win --publish never
      - name: Attach executable to the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/PokeIdleMultiview.exe
          fail_on_unmatched_files: true

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Attach executable to the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/PokeIdleMultiview.exe
          fail_on_unmatched_files: true
